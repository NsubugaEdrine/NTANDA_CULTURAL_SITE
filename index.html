<!--
  index.html — Vite entry point for the NTANDA heritage platform.
  This is the single HTML shell that Vite loads. It:
    - Sets the document language, viewport and page title.
    - Preloads the Google Fonts used by the design system
      (Libre Caslon Text for headings, Hanken Grotesk for body text,
      and Material Symbols Outlined for icons).
    - Provides the empty #root <div> where the React app mounts.
    - Loads the compiled entry module /src/main.tsx.
  Vite injects the compiled CSS and assets here at build/dev time.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTANDA - African Cultural Heritage Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#fdf8f6] text-[#1c1b1a] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
